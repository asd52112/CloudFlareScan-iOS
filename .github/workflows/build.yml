name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' CloudFlareScan.xcodeproj/project.pbxproj
      - name: Build unsigned archive
        run: |
          xcodebuild archive             -project CloudFlareScan.xcodeproj             -scheme CloudFlareScan             -configuration Release             -sdk iphoneos             -archivePath build/CloudFlareScan.xcarchive             PRODUCT_BUNDLE_IDENTIFIER=com.cloudflarescan.ios             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/CloudFlareScan.xcarchive/Products/Applications/CloudFlareScan.app build/Payload/
          cd build
          zip -r CloudFlareScan-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-unsigned
          path: build/CloudFlareScan-unsigned.ipa
